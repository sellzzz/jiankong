<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>币圈资金费率监控</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>币圈资金费率监控</h1>
        <p>聚合 Binance / Bybit / OKX 永续合约资金费率，支持自动刷新与阈值高亮。</p>
      </header>

      <section class="controls" aria-label="控制面板">
        <label>
          刷新间隔（秒）
          <input id="refreshInterval" type="number" min="10" max="600" value="30" />
        </label>
        <label>
          费率高亮阈值（%）
          <input id="highlightThreshold" type="number" step="0.001" min="0" max="5" value="0.05" />
        </label>
        <button id="refreshNowBtn" type="button">立即刷新</button>
        <span id="status" role="status" aria-live="polite">准备就绪</span>
      </section>

      <section class="table-wrapper" aria-label="费率列表">
        <table>
          <thead>
            <tr>
              <th>交易所</th>
              <th>交易对</th>
              <th>资金费率</th>
              <th>下次结算时间 (UTC)</th>
              <th>更新时间 (UTC)</th>
            </tr>
          </thead>
          <tbody id="ratesBody">
            <tr>
              <td colspan="5" class="placeholder">暂无数据，点击“立即刷新”开始拉取。</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
